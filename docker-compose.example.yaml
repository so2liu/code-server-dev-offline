services:
  code-server:
    image: ghcr.io/so2liu/code-server-dev:latest
    container_name: code-server-dev

    environment:
      # CCR (Claude Code Router) 配置
      - ANTHROPIC_BASE_URL=http://localhost:3456
      # 请设置您的 API 密钥 (智谱 AI 或其他提供商)
      - ANTHROPIC_AUTH_TOKEN=sk-your-api-key-here

    volumes:
      # AI 工具配置 (可选：如需自定义 CCR 配置)
      # - ./config/.claude-code-router:/home/coder/.claude-code-router

      # 工作目录（持久化数据）
      - ./data:/workspace

    ports:
      - "8080:8080"   # Code-Server Web IDE
      - "3456:3456"   # CCR 管理界面

    restart: unless-stopped

    # 可选：主机名映射（用于访问宿主机服务）
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
