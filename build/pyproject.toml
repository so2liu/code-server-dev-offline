[project]
name = "code-server-dev"
version = "0.1.0"
description = "Code-Server development environment with AI tools"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    # Logging and visualization
    "loguru==0.7.3",
    "matplotlib==3.10.1",

    # Web frameworks
    "fastapi==0.115.11",
    "uvicorn==0.34.0",

    # AI/LLM frameworks
    "langchain-openai==0.3.9",
    "langchain[openai]==0.3.9",
    "langgraph==0.3.16",

    # Data handling
    "pydantic[email]==2.10.6",
    "pydantic-settings==2.8.1",

    # Database
    "sqlmodel>=0.0.24",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",

    # AI tools integration
    "mcp[cli]>=1.9.1",
    "langchain-mcp-adapters>=0.1.7",
    "claude-code-sdk>=0.0.17",

    # HTTP and networking
    "httpx[socks]>=0.28.1",

    # Object storage
    "minio>=7.2.15",

    # Observability
    "langfuse>=3.1.3",

    # MCP server framework
    "fastmcp>=2.9.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "debugpy>=1.8.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
